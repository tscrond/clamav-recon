services:
  navidrome:
    image: navidrome/navidrome:latest
    user: "1000:1000"
    ports:
      - "4533:4533"
    restart: unless-stopped

    volumes:
      - type: bind
        source: /etc/navidrome/data
        target: /data

      - type: bind
        source: /etc/navidrome/music
        target: /music
        read_only: true

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4533/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s