services:
  alloy:
    image: grafana/alloy:latest
    container_name: prod_alloy
    restart: unless-stopped
    network_mode: host
    pid: host
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - |
          set -e
          exec 3<>/dev/tcp/127.0.0.1/12345
          printf 'GET /-/ready HTTP/1.0\r\n\r\n' >&3
          grep -q '^HTTP/[0-9.]* 200 ' <&3
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - type: bind
        source: ./compose/monitoring/config.alloy
        target: /etc/alloy/config.alloy
        read_only: true
        bind:
          create_host_path: false
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro,rslave
      - alloy-data:/var/lib/alloy/data

volumes:
  alloy-data: