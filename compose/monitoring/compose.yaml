services:
  alloy:
    image: grafana/alloy:latest
    container_name: prod_alloy
    restart: unless-stopped
    network_mode: host
    pid: host
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    healthcheck:
      test: ["CMD", "ls", "-lah"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - type: bind
        source: ./compose/monitoring/config.alloy
        target: /etc/alloy/config.alloy
        read_only: true
        bind:
          create_host_path: false
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro,rslave
      - alloy-data:/var/lib/alloy/data

volumes:
  alloy-data: