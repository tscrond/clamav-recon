# Equivalent of /root/apps/clamav/compose.yaml on edge-server-1, observed on
# 2026-11-15. The image digests pin the exact images that were running.
services:
  clamav-rest:
    container_name: clamav-rest
    mem_reservation: "4G"
    mem_limit: "6G"
    image: ajilaag/clamav-rest@sha256:bdf9af38492ac5232068050bc1866feb7a3b96942dfc7880e97b441d7f627aad
    read_only: true
    user: 100:101

    volumes:
      - clamav:/clamav:rw
      - run-clamav:/run/clamav:rw
      - var-log-clamav:/var/log/clamav:rw

    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9000/"]
      interval: 60s
      timeout: 2s
      retries: 2
      start_period: 210s

    environment:
      MAX_FILE_SIZE: "3G"
      MAX_SCAN_SIZE: "3G"

    ports:
      - "9111:9000/tcp"
      - "3310:3310/tcp"

    networks:
      - proxy

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"

      - "traefik.http.routers.clamav.rule=Host(`clamav.orion-software.org`)"
      - "traefik.http.routers.clamav.entrypoints=websecure"
      - "traefik.http.routers.clamav.tls=true"
      - "traefik.http.routers.clamav.tls.certresolver=le"

      - "traefik.http.services.clamav.loadbalancer.server.port=9000"

      # The value is the complete "user:bcrypt-hash" entry from the live stack.
      - "traefik.http.middlewares.clamav-auth.basicauth.users=${CLAMAV_BASIC_AUTH_USERS:?Recon did not provide the ClamAV Basic Auth secret}"
      - "traefik.http.routers.clamav.middlewares=clamav-auth"

  clamav-exporter:
    image: sergeymakinen/clamav_exporter:v2.1.12@sha256:66bc4f313d4c1f3baa73a75cb57a5c55c1095fb8687c6eb6cd66954eed084911
    container_name: clamav-exporter
    restart: unless-stopped

    command:
      - "--clamav.address=tcp://clamav-rest:3310"
      - "--clamav.timeout=10s"
      - "--clamav.retries=3"

    depends_on:
      - clamav-rest
    ports:
      - "9906:9906/tcp"
    networks:
      - proxy

volumes:
  clamav:
  run-clamav:
  var-log-clamav:

networks:
  proxy:
    external: true
