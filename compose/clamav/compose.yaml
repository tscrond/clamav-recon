# Equivalent of /root/apps/clamav/compose.yaml on edge-server-1, observed on
# 2026-11-15. The image digests pin the exact images that were running.
services:
  clamav-rest-0:
    container_name: clamav-rest-0
    mem_reservation: "4G"
    mem_limit: "6G"
    image: ajilaag/clamav-rest@sha256:bdf9af38492ac5232068050bc1866feb7a3b96942dfc7880e97b441d7f627aad
    read_only: true
    user: 100:101

    volumes:
      - clamav-0:/clamav:rw
      - run-clamav-0:/run/clamav:rw
      - var-log-clamav-0:/var/log/clamav:rw

    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9000/"]
      interval: 60s
      timeout: 2s
      retries: 2
      start_period: 60s

    environment:
      MAX_FILE_SIZE: "3G"
      MAX_SCAN_SIZE: "3G"

    ports:
      - "9112:9000/tcp"
      - "3311:3310/tcp"

    networks:
      - proxy

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"

      - "traefik.http.routers.clamav-0.rule=Host(`clamav-0.orion-software.org`)"
      - "traefik.http.routers.clamav-0.entrypoints=websecure"
      - "traefik.http.routers.clamav-0.tls=true"
      - "traefik.http.routers.clamav-0.tls.certresolver=le"

      - "traefik.http.services.clamav-0.loadbalancer.server.port=9000"

      # The value is the complete "user:bcrypt-hash" entry from the live stack.
      - "traefik.http.middlewares.clamav-auth-0.basicauth.users=${CLAMAV_BASIC_AUTH_USERS:-}"
      - "traefik.http.routers.clamav-0.middlewares=clamav-auth-0"
      - "monitor_logs=true"

  clamav-exporter-0:
    image: sergeymakinen/clamav_exporter:v2.1.12@sha256:66bc4f313d4c1f3baa73a75cb57a5c55c1095fb8687c6eb6cd66954eed084911
    container_name: clamav-exporter-0
    restart: unless-stopped

    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9906/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    command:
      - "--clamav.address=tcp://clamav-rest-0:3310"
      - "--clamav.timeout=10s"
      - "--clamav.retries=3"

    depends_on:
      - clamav-rest-0
    ports:
      - "9907:9906/tcp"
    networks:
      - proxy

volumes:
  clamav-0:
  run-clamav-0:
  var-log-clamav-0:

networks:
  proxy:
    external: true
